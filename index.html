<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songs of the Stone</title>
    <meta name="description" content="Songs of the Stone is Inkpot's flagship series of after-hours cultural evenings at Delhi's heritage monuments. Here, space becomes stage, arches become resonance, and stone becomes story. " />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Dynamic viewport height fix for mobile (sets --vh = 1% of visual viewport)
      function setVh() {
        const vh = window.visualViewport ? window.visualViewport.height * 0.01 : window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
    </script>
  </body>
</html>
